# Copie para .github/workflows/deploy.yml (BE-32).
# Ao criar a tag vX.Y.Z na main: roda o build completo, publica a imagem no GHCR e atualiza a VPS por SSH.
# Segredos do repositório: VPS_HOST, VPS_USUARIO, VPS_CHAVE_SSH (chave privada), VPS_DIRETORIO (pasta com compose.prod.yaml e .env.prod).
name: Deploy

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dietamais-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/dietamais-api:latest

  implantar:
    needs: publicar
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USUARIO }}
          key: ${{ secrets.VPS_CHAVE_SSH }}
          script: |
            set -e
            cd "${{ secrets.VPS_DIRETORIO }}"
            git fetch --tags && git checkout "${{ github.ref_name }}"
            VERSAO="${{ github.ref_name }}" docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
            docker compose -f compose.prod.yaml exec -T backup /ops/backup.sh agora
            curl -fsS "https://$(grep ^DOMINIO= .env.prod | cut -d= -f2)/actuator/health/readiness"
