              ('019a0000-0003-7000-8000-000000000008',NULL,'Obesidade (hipocalórica)','Dieta hipocalórica com porções menores de pão, arroz e açúcar, sem açúcar de adição. Conteúdo inicial sugerido, a validar pela nutri antes do uso clínico (G-15).','Obesidade','Déficit calórico moderado, definido pela nutri a partir do VET do paciente (peso ajustado quando o IMC é 30 ou mais). Coma devagar, beba água e privilegie verduras e proteínas magras. Sem açúcar de adição.','Além das refeições acima, você pode comer verduras e legumes crus à vontade e beber água ao longo do dia.','[{"grupoId": "019a0000-0000-7000-8000-000000000001", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000002", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000003", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000004", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000005", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000006", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000007", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000008", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000009", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000010", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000011", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000012", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000013", "opcao": 2}]'::jsonb,'{"vetKcal": 1192, "carboidratoPct": 50, "proteinaPct": 25, "lipidioPct": 25}'::jsonb,ARRAY['ACUCAR_ADICIONADO']::text[],1191.71,'[{"id": "019a0000-0003-7000-8108-000000000001", "nome": "Desjejum", "horario": "07:00:00", "ordem": 0, "itens": [{"grupoId": "019a0000-0000-7000-8000-000000000006", "porcoes": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000001", "porcoes": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000002", "porcoes": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000007", "porcoes": 1}]}, {"id": "019a0000-0003-7000-8108-000000000002", "nome":