              ('019a0000-0003-7000-8000-000000000002',NULL,'Hipertensão (DASH)','Baseado na dieta DASH: mais frutas e vegetais, leite desnatado e pouco sódio. Conteúdo inicial sugerido, a validar pela nutri antes do uso clínico (G-15).','Hipertensão','Sódio de até 2000 mg por dia. Evite embutidos, enlatados, temperos prontos, caldos e sopas industrializadas, e reduza o sal de adição. Prefira temperos naturais. Mais frutas, verduras e leguminosas. O leite é desnatado.','Além das refeições acima, você pode comer verduras e legumes crus à vontade e beber água ao longo do dia. Retire o saleiro da mesa.','[{"grupoId": "019a0000-0000-7000-8000-000000000001", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000002", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000003", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000004", "opcao": 3}, {"grupoId": "019a0000-0000-7000-8000-000000000005", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000006", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000007", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000008", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000009", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000010", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000011", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000012", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000013", "opcao": 2}]'::jsonb,'{"vetKcal": 1902, "carboidratoPct": 55, "proteinaPct": 18, "lipidioPct": 27}'::jsonb,ARRAY['ALTO_SODIO']::text[],1902.46,'[{"id": "019a0000-0003-7000-8102-000000000001", "nome": "Desjejum", "horario": "07:00:00", "ordem": 0, "itens": [{"grupoId": "019a0000-0000-7000-8000-000000000006", "porcoes": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000001", "porcoes": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000002", "porcoes": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000007", "porcoes": 1}, {"grupoId": "019a0000-0000-7000-80