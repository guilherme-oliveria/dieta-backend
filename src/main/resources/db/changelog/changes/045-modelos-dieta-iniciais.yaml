databaseChangeLog:
  - changeSet:
      id: 045-modelos-dieta-iniciais
      author: dietamais
      comment: >-
        BE-53: 9 modelos iniciais do sistema (somente leitura, RN-MOD-01), em porções por grupo e sem alimentos da lista de nenhuma nutri.
        [SUPOSIÇÃO G-15] o conteúdo clínico e as restrições são sugestão e precisam de validação da nutri.
        A energia de referência é a soma real das porções das refeições principais.
      changes:
        - sql:
            splitStatements: false
            sql: |
              INSERT INTO modelo_dieta(id,nutricionista_id,titulo,descricao,condicao,orientacao,rodape,porcoes,metas,restricoes,kcal_referencia,refeicoes) VALUES
              ('019a0000-0003-7000-8000-000000000001',NULL,'Sem restrições','Dieta geral de partida, montada nas porções por grupo da planilha de dieta sem restrições. Conteúdo inicial sugerido, a validar pela nutri antes do uso clínico (G-15).','Geral','Faça as refeições nos horários indicados, mastigue devagar e beba água ao longo do dia. Ajuste as porções às suas metas com a nutri.','Além das refeições acima, você pode comer verduras e legumes crus à vontade e beber água ao longo do dia.','[{"grupoId": "019a0000-0000-7000-8000-000000000001", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000002", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000003", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000004", "opcao": 3}, {"grupoId": "019a0000-0000-7000-8000-000000000005", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000006", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000007", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000008", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000009", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000010", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000011", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000012", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000013", "opcao": 2}]'::jsonb,'{"vetKcal": 1816, "carboidratoPct": 55, "proteinaPct": 20, "lipidioPct": 25}'::jsonb,ARRAY[]::text[],1815.75,'[{"id": "019a0000-0003-7000-8101-000000000001", "nome": "Desjejum", "horario": "07:00:00", "ordem": 0, "itens": [{"grupoId": "019a0000-0000-7000-8000-000000000006", "porcoes": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000001", "porcoes": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000002", "porcoes": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000007", "porcoes": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000011", "porcoes": 1}]}, {"id": "019a0000-0003-7000-8101-000000000002", "nome": "Lanche da manhã", "horario": "1