              ('019a0000-0003-7000-8000-000000000004',NULL,'Diabetes tipo 2','Sem açúcar de adição e com o carboidrato distribuído ao longo do dia. Conteúdo inicial sugerido, a validar pela nutri antes do uso clínico (G-15).','Diabetes tipo 2','Sem açúcar de adição. Distribua o carboidrato nas refeições, sem pular refeições. Prefira cereais integrais e fibras. Use a lista de substituição com contagem de carboidratos para trocar alimentos sem mudar a quantidade de carboidrato.','Além das refeições acima, você pode comer verduras e legumes crus à vontade e beber água ao longo do dia.','[{"grupoId": "019a0000-0000-7000-8000-000000000001", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000002", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000003", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000004", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000005", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000006", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000007", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000008", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000009", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000010", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000011", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000012", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000013", "opcao": 2}]'::jsonb,'{"vetKcal": 1701, "carboidratoPct": 45, "proteinaPct": 20, "lipidioPct": 35}'::jsonb,ARRAY['ACUCAR_ADICIONADO']::text[],1701.21,'[{"id": "019a0000-0003-7000-8104-000000000001", "nome": "Desjejum", "horario": "07:00:00", "ordem": 0, "itens": [{"grupoId": "019a0000-0000-7000-8000-000000000006", "porcoes": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000001", "porcoes": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000002", "porcoes": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000007", "porcoes": 1}]}, {"id": "019a0000-0003-7000-8104-0000000000