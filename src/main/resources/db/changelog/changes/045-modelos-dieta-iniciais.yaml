              ('019a0000-0003-7000-8000-000000000009',NULL,'Doença renal crônica (sem diálise)','Proteína reduzida, com pouco sódio e potássio. Conteúdo inicial sugerido, a validar pela nutri antes do uso clínico (G-15).','Doença renal crônica','Proteína de 0,6 a 0,8 g por kg ao dia, conforme a nutri. Evite alimentos ricos em potássio (banana, laranja, tomate, batata, feijão em excesso) e em sódio (embutidos, enlatados e temperos prontos). Deixe legumes de molho e cozinhe em bastante água para reduzir o potássio.','Além das refeições acima, você pode comer verduras e legumes crus à vontade e beber água ao longo do dia.','[{"grupoId": "019a0000-0000-7000-8000-000000000001", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000002", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000003", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000004", "opcao": 3}, {"grupoId": "019a0000-0000-7000-8000-000000000005", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000006", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000007", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000008", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000009", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000010", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000011", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000012", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000013", "opcao": 2}]'::jsonb,'{"vetKcal": 1539, "carboidratoPct": 60, "proteinaPct": 10, "lipidioPct": 30}'::jsonb,ARRAY['ALTO_POTASSIO','ALTO_SODIO']::text[],1539.1,'[{"id": "019a0000-0003-7000-8109-000000000001", "nome": "Desjejum", "horario": "07:00:00", "ordem": 0, "itens": [{"grupoId": "019a0000-0000-7000-8000-000000000006", "porcoes": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000001", "porcoes": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000002", "porcoes": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000007", "porcoes": 1}