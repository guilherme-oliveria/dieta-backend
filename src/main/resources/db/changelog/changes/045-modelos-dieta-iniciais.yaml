              ('019a0000-0003-7000-8000-000000000005',NULL,'Dislipidemia','Menos gordura saturada e colesterol, com mais fibras. Conteúdo inicial sugerido, a validar pela nutri antes do uso clínico (G-15).','Dislipidemia','Metas da SBC: gordura saturada até 7% do VET, gordura trans até 1% e colesterol até 200 mg por dia. Prefira carnes magras e grelhadas, retire a gordura visível e evite embutidos e frituras. Inclua fibras solúveis (aveia, frutas, leguminosas) e oleaginosas nas porções indicadas.','Além das refeições acima, você pode comer verduras e legumes crus à vontade e beber água ao longo do dia.','[{"grupoId": "019a0000-0000-7000-8000-000000000001", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000002", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000003", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000004", "opcao": 3}, {"grupoId": "019a0000-0000-7000-8000-000000000005", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000006", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000007", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000008", "opcao": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000009", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000010", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000011", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000012", "opcao": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000013", "opcao": 2}]'::jsonb,'{"vetKcal": 1591, "carboidratoPct": 55, "proteinaPct": 20, "lipidioPct": 25}'::jsonb,ARRAY[]::text[],1590.53,'[{"id": "019a0000-0003-7000-8105-000000000001", "nome": "Desjejum", "horario": "07:00:00", "ordem": 0, "itens": [{"grupoId": "019a0000-0000-7000-8000-000000000006", "porcoes": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000001", "porcoes": 2}, {"grupoId": "019a0000-0000-7000-8000-000000000002", "porcoes": 1}, {"grupoId": "019a0000-0000-7000-8000-000000000007", "porcoes": 1}, {"grupoId": "019a0000-0000-7000-8000-00000