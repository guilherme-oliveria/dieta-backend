databaseChangeLog:
  - changeSet:
      id: 032-protocolos-nutri
      author: dietamais
      comment: Meus protocolos (BE-42); padrão da nutri para as próximas avaliações, com versão e entrada no sync
      changes:
        - sql:
            sql: >-
              CREATE TABLE protocolo_nutri (
              nutricionista_id uuid PRIMARY KEY REFERENCES nutricionista(id),
              dobras varchar(10) NOT NULL,
              massa varchar(10) NOT NULL,
              versao bigint NOT NULL DEFAULT 1,
              criado_em timestamptz NOT NULL,
              atualizado_em timestamptz NOT NULL,
              CONSTRAINT ck_protocolo_nutri_dobras CHECK (dobras IN ('TRES','SETE')),
              CONSTRAINT ck_protocolo_nutri_massa CHECK (massa IN ('MAGRO','MUSCULAR')));
              ALTER TABLE diario_sync DROP CONSTRAINT ck_diario_sync_colecao;
              ALTER TABLE diario_sync ADD CONSTRAINT ck_diario_sync_colecao CHECK (colecao IN
              ('PACIENTES','VINCULOS','NUTRIS','GRUPOS','ALIMENTOS','LISTAS','DIETAS','SNAPSHOTS','DIETA_EM_USO','CHECKINS','AGUA','PESOS','AVALIACOES','MODELOS','QUESTIONARIOS','CONSULTAS','AVISOS','PROTOCOLOS'));
        - sql:
            splitStatements: false
            sql: |
              CREATE FUNCTION protocolo_nutri_diario_sync() RETURNS trigger LANGUAGE plpgsql AS $$
              BEGIN
                PERFORM registrar_mudanca_sync('NUTRICIONISTA',NEW.nutricionista_id,'PROTOCOLOS',NEW.nutricionista_id,NEW.nutricionista_id,NULL);
                RETURN NEW;
              END;
              $$;
        - sql:
            sql: >-
              CREATE TRIGGER protocolo_nutri_diario_sync AFTER INSERT OR UPDATE ON protocolo_nutri FOR EACH ROW EXECUTE FUNCTION protocolo_nutri_diario_sync();
