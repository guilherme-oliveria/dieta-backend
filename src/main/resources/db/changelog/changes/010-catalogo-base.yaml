databaseChangeLog:
  - changeSet:
      id: 010-catalogo-base
      author: dietamais
      changes:
        - createTable:
            tableName: grupo_alimento
            columns:
              - column: { name: id, type: uuid, defaultValueComputed: uuidv7(), constraints: { primaryKey: true, nullable: false } }
              - column: { name: nome, type: varchar(150), constraints: { nullable: false, unique: true } }
              - column: { name: kcal_por_porcao, type: 'numeric(12,4)', constraints: { nullable: false } }
              - column: { name: carboidratos_por_porcao, type: 'numeric(12,4)', constraints: { nullable: false } }
              - column: { name: proteinas_por_porcao, type: 'numeric(12,4)', constraints: { nullable: false } }
              - column: { name: gorduras_por_porcao, type: 'numeric(12,4)', constraints: { nullable: false } }
              - column: { name: versao, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: seq, type: bigint, defaultValueComputed: "nextval('seq_sync')", constraints: { nullable: false } }
              - column: { name: criado_em, type: timestamptz, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: atualizado_em, type: timestamptz, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: excluido_em, type: timestamptz }
        - createTable:
            tableName: alimento
            columns:
              - column: { name: id, type: uuid, defaultValueComputed: uuidv7(), constraints: { primaryKey: true, nullable: false } }
              - column: { name: grupo_id, type: uuid, constraints: { nullable: false, foreignKeyName: fk_alimento_grupo, references: grupo_alimento(id) } }
              - column: { name: nome, type: varchar(150), constraints: { nullable: false } }
              - column: { name: medida_caseira, type: varchar(150), constraints: { nullable: false } }
              - column: { name: gramas_por_porcao, type: 'numeric(12,4)', constraints: { nullable: false } }
              - column: { name: ativo, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: versao, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: seq, type: bigint, defaultValueComputed: "nextval('seq_sync')", constraints: { nullable: false } }
              - column: { name: criado_em, type: timestamptz, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: atualizado_em, type: timestamptz, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: excluido_em, type: timestamptz }
        - createTable:
            tableName: fonte_macros_grupo
            columns:
              - column: { name: grupo_id, type: uuid, constraints: { primaryKey: true, nullable: false, foreignKeyName: fk_fonte_macros_grupo, references: grupo_alimento(id) } }
              - column: { name: fonte, type: varchar(100), constraints: { nullable: false } }
              - column: { name: url, type: varchar(500), constraints: { nullable: false } }
              - column: { name: edicao, type: varchar(100), constraints: { nullable: false } }
              - column: { name: consultado_em, type: date, constraints: { nullable: false } }
              - column: { name: codigo, type: varchar(50), constraints: { nullable: false } }
              - column: { name: representante, type: varchar(250), constraints: { nullable: false } }
              - column: { name: base_gramas, type: 'numeric(12,4)', constraints: { nullable: false } }
              - column: { name: kcal_base, type: 'numeric(12,4)', constraints: { nullable: false } }
              - column: { name: carboidratos_base, type: 'numeric(12,4)', constraints: { nullable: false } }
              - column: { name: proteinas_base, type: 'numeric(12,4)', constraints: { nullable: false } }
              - column: { name: gorduras_base, type: 'numeric(12,4)', constraints: { nullable: false } }
              - column: { name: paginas_pdf, type: varchar(30), constraints: { nullable: false } }
              - column: { name: metodo, type: varchar(100), constraints: { nullable: false } }
              - column: { name: estimativa, type: boolean, constraints: { nullable: false } }
        - createIndex:
            tableName: alimento
            indexName: ix_alimento_grupo_nome
            columns:
              - column: { name: grupo_id }
              - column: { name: nome }
        - sql:
            sql: >-
              ALTER TABLE grupo_alimento ADD CONSTRAINT ck_grupo_nutrientes CHECK
              (kcal_por_porcao>=0 AND carboidratos_por_porcao>=0 AND proteinas_por_porcao>=0 AND gorduras_por_porcao>=0);
              ALTER TABLE alimento ADD CONSTRAINT ck_alimento_gramas CHECK (gramas_por_porcao>0);
              ALTER TABLE fonte_macros_grupo ADD CONSTRAINT ck_fonte_macros_base CHECK
              (base_gramas>0 AND kcal_base>0 AND carboidratos_base>=0 AND proteinas_base>=0 AND gorduras_base>=0);
        - loadData:
            tableName: grupo_alimento
            file: db/changelog/dados/grupos-alimentos.csv
            encoding: UTF-8
            separator: ";"
            usePreparedStatements: true
            columns:
              - column: { header: id, name: id, type: UUID }
              - column: { header: nome, name: nome, type: STRING }
              - column: { header: kcal_por_porcao, name: kcal_por_porcao, type: NUMERIC }
              - column: { header: carboidratos_por_porcao, name: carboidratos_por_porcao, type: NUMERIC }
              - column: { header: proteinas_por_porcao, name: proteinas_por_porcao, type: NUMERIC }
              - column: { header: gorduras_por_porcao, name: gorduras_por_porcao, type: NUMERIC }
        - loadData:
            tableName: fonte_macros_grupo
            file: db/changelog/dados/fontes-macros-grupos.csv
            encoding: UTF-8
            separator: ";"
            usePreparedStatements: true
            columns:
              - column: { header: grupo_id, name: grupo_id, type: UUID }
              - column: { header: fonte, name: fonte, type: STRING }
              - column: { header: url, name: url, type: STRING }
              - column: { header: edicao, name: edicao, type: STRING }
              - column: { header: consultado_em, name: consultado_em, type: DATE }
              - column: { header: codigo, name: codigo, type: STRING }
              - column: { header: representante, name: representante, type: STRING }
              - column: { header: base_gramas, name: base_gramas, type: NUMERIC }
              - column: { header: kcal_base, name: kcal_base, type: NUMERIC }
              - column: { header: carboidratos_base, name: carboidratos_base, type: NUMERIC }
              - column: { header: proteinas_base, name: proteinas_base, type: NUMERIC }
              - column: { header: gorduras_base, name: gorduras_base, type: NUMERIC }
              - column: { header: paginas_pdf, name: paginas_pdf, type: STRING }
              - column: { header: metodo, name: metodo, type: STRING }
              - column: { header: estimativa, name: estimativa, type: BOOLEAN }
        - loadData:
            tableName: alimento
            file: db/changelog/dados/alimentos.csv
            encoding: UTF-8
            separator: ";"
            usePreparedStatements: true
            columns:
              - column: { header: id, name: id, type: UUID }
              - column: { header: grupo_id, name: grupo_id, type: UUID }
              - column: { header: nome, name: nome, type: STRING }
              - column: { header: medida_caseira, name: medida_caseira, type: STRING }
              - column: { header: gramas_por_porcao, name: gramas_por_porcao, type: NUMERIC }
              - column: { header: ativo, name: ativo, type: BOOLEAN }
