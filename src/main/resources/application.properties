spring.application.name=dietamais
spring.profiles.default=dev

# Banco de dados (em produção, defina por variáveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dietamais}
spring.datasource.username=${DB_USERNAME:dietamais}
spring.datasource.password=${DB_PASSWORD:dietamais}

# O schema é versionado pelo Liquibase; o Hibernate só valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Actuator: só health exposto
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Swagger UI somente quando habilitada no ambiente de desenvolvimento
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}

# SMTP local no Mailpit (perfil extras do Compose); credenciais por variáveis SPRING_MAIL_*.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
dieta.notificacoes.envio-habilitado=${EMAIL_ENVIO_HABILITADO:false}
dieta.push.habilitado=${PUSH_ENVIO_HABILITADO:false}
dieta.push.fcm.credenciais-json=${FCM_CREDENCIAIS_JSON:}

# Gateway de pagamento Asaas (BE-26): segredos só por variável de ambiente; sem chave, o checkout fica indisponível
dieta.pagamento.asaas.api-key=${ASAAS_API_KEY:}
dieta.pagamento.asaas.token-webhook=${ASAAS_WEBHOOK_TOKEN:}
dieta.pagamento.asaas.url-base=${ASAAS_URL_BASE:https://api-sandbox.asaas.com}
