spring.application.name=dietamais
spring.profiles.default=dev

# Banco de dados (em produção, defina por variáveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dietamais}
spring.datasource.username=${DB_USERNAME:dietamais}
spring.datasource.password=${DB_PASSWORD:dietamais}

# O schema é versionado pelo Liquibase; o Hibernate só valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Actuator: só health exposto
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# E-mail sai por fila assíncrona com tentativas: SMTP fora do ar não derruba a saúde da API (nem reinicia o container).
management.health.mail.enabled=false

# Swagger UI somente quando habilitada no ambiente de desenvolvimento
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}

# SMTP local no Mailpit (perfil extras do Compose); credenciais por variáveis SPRING_MAIL_*.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
dieta.notificacoes.envio-habilitado=${EMAIL_ENVIO_HABILITADO:false}
dieta.push.habilitado=${PUSH_ENVIO_HABILITADO:false}
dieta.push.fcm.credenciais-json=${FCM_CREDENCIAIS_JSON:}

# Gateway de pagamento Asaas (BE-26): segredos só por variável de ambiente; sem chave, o checkout fica indisponível
dieta.pagamento.asaas.api-key=${ASAAS_API_KEY:}
dieta.pagamento.asaas.token-webhook=${ASAAS_WEBHOOK_TOKEN:}
dieta.pagamento.asaas.url-base=${ASAAS_URL_BASE:https://api-sandbox.asaas.com}

# Armazenamento de arquivos (BE-28): sem S3_ENDPOINT grava em disco local; segredos só por variável de ambiente
dieta.armazenamento.s3.endpoint=${S3_ENDPOINT:}
dieta.armazenamento.s3.bucket=${S3_BUCKET:dietamais}
dieta.armazenamento.s3.regiao=${S3_REGIAO:us-east-1}
dieta.armazenamento.s3.chave-acesso=${S3_CHAVE_ACESSO:}
dieta.armazenamento.s3.chave-secreta=${S3_CHAVE_SECRETA:}
dieta.armazenamento.local.dir=${ARQUIVOS_DIR:}
dieta.armazenamento.local.segredo=${ARQUIVOS_SEGREDO:}
dieta.publico.url-base=${URL_PUBLICA:http://localhost:8080}
dieta.admin.email=${ADMIN_EMAIL:}
dieta.admin.senha=${ADMIN_SENHA:}

# Endurecimento (BE-31)
dieta.taxa.usuario-por-minuto=${TAXA_USUARIO_POR_MINUTO:300}
dieta.app.versao-minima=${APP_VERSAO_MINIMA:}
dieta.seguranca.hsts=${HSTS_HABILITADO:false}
dieta.seguranca.cors-origens=${CORS_ORIGENS:}
