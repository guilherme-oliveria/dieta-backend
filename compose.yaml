# Postgres 18 para desenvolvimento local.
# Ao rodar a aplicação pela IDE ou com ./gradlew bootRun, o Spring Boot sobe este container sozinho.
services:
  postgres:
    image: postgres:18
    container_name: dietamais-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dietamais}
      POSTGRES_USER: ${POSTGRES_USER:-dietamais}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dietamais}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A partir do Postgres 18 o volume é montado em /var/lib/postgresql (não mais em /var/lib/postgresql/data)
      - dietamais-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dietamais-pgdata:
