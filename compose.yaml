# Postgres 18 para desenvolvimento local.
# Ao rodar a aplicação pela IDE ou com ./gradlew bootRun, o Spring Boot sobe este container sozinho.
services:
  postgres:
    image: postgres:18
    container_name: dietamais-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dietamais}
      POSTGRES_USER: ${POSTGRES_USER:-dietamais}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dietamais}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A partir do Postgres 18 o volume é montado em /var/lib/postgresql (não mais em /var/lib/postgresql/data)
      - dietamais-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.27.4}
    labels:
      org.springframework.boot.ignore: "true"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    labels:
      org.springframework.boot.ignore: "true"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER no ambiente local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD no ambiente local}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_UI_PORT:-9001}:9001"
    volumes:
      - dietamais-minio:/data

volumes:
  dietamais-pgdata:
  dietamais-minio:
